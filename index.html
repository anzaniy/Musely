<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyrics</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="widget">
      <header class="top" data-tauri-drag-region>
        <div class="cover" id="cover" data-tauri-drag-region></div>

        <div class="meta" data-tauri-drag-region>
          <div class="title" id="title" data-tauri-drag-region>Menunggu Spotify…</div>
          <div class="subtitle" id="subtitle" data-tauri-drag-region>Belum ada lagu</div>
        </div>

        <span class="badge" id="badge">demo</span>
      </header>

      <section class="lyrics">
        <p class="line prev" id="line-prev">&nbsp;</p>
        <p class="line active" id="line-active">Tekan play di Spotify</p>
        <p class="line next" id="line-next">&nbsp;</p>
      </section>

      <footer class="controls">
        <div class="group transport">
          <button class="icon" id="btn-prev" type="button" title="Lagu sebelumnya" aria-label="Lagu sebelumnya">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="5" width="2.6" height="14" rx="1.1" />
              <path d="M20 6.1v11.8c0 .9-1 1.4-1.7.9l-8.6-5.9a1.1 1.1 0 0 1 0-1.8l8.6-5.9c.7-.5 1.7 0 1.7.9z" />
            </svg>
          </button>

          <button class="icon primary" id="btn-play" type="button" title="Putar / Jeda" aria-label="Putar atau jeda">
            <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.1v13.8c0 .9 1 1.4 1.7.9l10.2-6.9a1.1 1.1 0 0 0 0-1.8L9.7 4.2C9 3.7 8 4.2 8 5.1z" />
            </svg>
            <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6.5" y="5" width="4" height="14" rx="1.4" />
              <rect x="13.5" y="5" width="4" height="14" rx="1.4" />
            </svg>
          </button>

          <button class="icon" id="btn-next" type="button" title="Lagu berikutnya" aria-label="Lagu berikutnya">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="17.4" y="5" width="2.6" height="14" rx="1.1" />
              <path d="M4 6.1v11.8c0 .9 1 1.4 1.7.9l8.6-5.9a1.1 1.1 0 0 0 0-1.8L5.7 5.2C5 4.7 4 5.2 4 6.1z" />
            </svg>
          </button>
        </div>

        <div class="group offset" title="Geser waktu lirik">
          <button class="mini" id="btn-offset-minus" type="button" title="Lirik lebih lambat 100 ms" aria-label="Lirik lebih lambat">
            &minus;
          </button>
          <button class="offset-value" id="offset-value" type="button" title="Reset geser lirik">0 ms</button>
          <button class="mini" id="btn-offset-plus" type="button" title="Lirik lebih cepat 100 ms" aria-label="Lirik lebih cepat">
            +
          </button>
        </div>

        <button class="icon close" id="btn-close" type="button" title="Keluar aplikasi" aria-label="Keluar aplikasi">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.4 5.3 12 10.9l5.6-5.6a.9.9 0 0 1 1.3 1.3L13.3 12l5.6 5.6a.9.9 0 0 1-1.3 1.3L12 13.3l-5.6 5.6a.9.9 0 0 1-1.3-1.3l5.6-5.6-5.6-5.6a.9.9 0 0 1 1.3-1.3z" />
          </svg>
        </button>
      </footer>

      <div class="progress">
        <div class="progress-fill" id="progress"></div>
      </div>
    </div>
  </body>
</html>
